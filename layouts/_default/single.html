{{ define "main" }}
<article>
  <div class="crumb"><a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title | lower }}</a></div>
  <h1 class="page">{{ .Title }}</h1>
  <div class="meta">{{ if eq .Section "posts" }}{{ .Date.Format "January 2, 2006" }}{{ else }}{{ delimit (.Params.tags | default slice) ", " }}{{ end }}</div>
  <div class="body">{{ .Content }}</div>
</article>
{{ end }}
